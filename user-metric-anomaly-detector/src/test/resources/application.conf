# Test Configuration for User Metric Anomaly Detector

anomaly-detector {
  # Test parameters (faster execution)
  lookback-days = 90  # 3 months for faster tests
  iqr-multiplier = 1.5
  zscore-threshold = 3.0

  hive {
    user-metrics-table = "test.user_metrics"
    anomaly-results-table = "test.anomaly_detection_results"
    metric-statistics-table = "test.metric_statistics"
  }

  email {
    smtp-host = "localhost"
    smtp-port = 3025  # GreenMail test server port
    smtp-username = "test@example.com"
    smtp-password = "test-password"
    from = "test@example.com"
    to = ["test-recipient@example.com"]
    investigation-url = "http://localhost:8080/test"
  }
}
