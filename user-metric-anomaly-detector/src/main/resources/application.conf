# User Metric Anomaly Detector Configuration
# This file contains all configurable parameters for the anomaly detection system

anomaly-detector {

  # ============================================================================
  # Detection Parameters
  # ============================================================================

  # Number of days to look back for historical data (default: 4 years = 1460 days)
  # Recommended: 1-4 years depending on data availability and seasonality
  lookback-days = 1460

  # IQR (Interquartile Range) multiplier for outlier detection
  # Standard values:
  #   1.5 - Identifies outliers (typical)
  #   3.0 - Identifies extreme outliers only
  # Lower values = more sensitive detection
  iqr-multiplier = 1.5

  # Z-Score threshold for standard deviation-based detection
  # Standard values:
  #   2.0 - 95% confidence interval
  #   3.0 - 99.7% confidence interval (typical)
  # Higher values = less sensitive detection
  zscore-threshold = 3.0

  # ============================================================================
  # Hive Configuration
  # ============================================================================

  hive {
    # Source table containing daily user metrics
    # Expected schema: metric_date (DATE), user_count (BIGINT), data_source (STRING), load_timestamp (TIMESTAMP)
    # Partitioned by: year (INT), month (INT)
    user-metrics-table = "default.user_metrics"

    # Target table for storing anomaly detection results
    # Schema defined in create-hive-tables.sql
    # Partitioned by: year (INT), month (INT)
    anomaly-results-table = "default.anomaly_detection_results"

    # Table for storing pre-calculated statistics (optional optimization)
    # Schema defined in create-hive-tables.sql
    # Not partitioned (small reference table)
    metric-statistics-table = "default.metric_statistics"
  }

  # ============================================================================
  # Email Configuration
  # ============================================================================

  email {
    # SMTP server configuration
    # For Gmail: smtp.gmail.com, port 587 (TLS)
    # For Office 365: smtp.office365.com, port 587 (TLS)
    # For internal servers: check with your IT team
    smtp-host = "smtp.example.com"
    smtp-port = 587

    # SMTP authentication credentials
    # IMPORTANT: In production, use environment variables or secure secret management
    # Example using env vars:
    #   smtp-username = ${?SMTP_USERNAME}
    #   smtp-password = ${?SMTP_PASSWORD}
    smtp-username = "anomaly-detector@example.com"
    smtp-password = "your-password-here"

    # Sender email address
    from = "anomaly-detector@example.com"

    # Recipient email addresses (supports multiple recipients)
    to = [
      "data-engineering@example.com",
      "analytics-team@example.com"
    ]

    # URL for investigation dashboard (included in email alerts)
    # Placeholder - update with your actual dashboard URL
    # You can use parameters like ${date} if your dashboard supports it
    investigation-url = "https://dashboard.example.com/metrics?date={date}"
  }

  # ============================================================================
  # Spark Configuration (optional - can also be set via spark-submit)
  # ============================================================================

  spark {
    # Application name
    app-name = "User Metric Anomaly Detector"

    # Shuffle partitions (adjust based on data size)
    # Rule of thumb: 2-4x number of executor cores
    sql.shuffle.partitions = 200

    # Enable adaptive query execution for better performance
    sql.adaptive.enabled = true

    # Enable Hive support
    sql.catalogImplementation = "hive"
  }
}

# ============================================================================
# Environment-Specific Overrides
# ============================================================================

# Development environment
dev {
  anomaly-detector {
    lookback-days = 365  # 1 year for faster testing
    email {
      to = ["dev-team@example.com"]
    }
  }
}

# Production environment
prod {
  anomaly-detector {
    lookback-days = 1460  # 4 years
    email {
      to = [
        "data-engineering@example.com",
        "analytics-team@example.com",
        "ops-team@example.com"
      ]
    }
  }
}

# ============================================================================
# Notes and Best Practices
# ============================================================================

# 1. Security:
#    - Never commit passwords to version control
#    - Use environment variables: smtp-password = ${?SMTP_PASSWORD}
#    - Or use secure secret management (HashiCorp Vault, AWS Secrets Manager, etc.)

# 2. Performance:
#    - Adjust lookback-days based on your data volume and seasonality
#    - For weekly patterns, minimum 8-12 weeks recommended
#    - For yearly patterns, minimum 2 years recommended

# 3. Tuning Detection Sensitivity:
#    - Too many false positives? Increase iqr-multiplier and zscore-threshold
#    - Missing real anomalies? Decrease these values
#    - Monitor and adjust based on your data characteristics

# 4. Email Configuration:
#    - Test SMTP settings before production deployment
#    - Some SMTP servers require "App Passwords" instead of regular passwords
#    - Check firewall rules if connection fails

# 5. Hive Tables:
#    - Ensure tables exist before running (use create-hive-tables.sql)
#    - Verify partition pruning is working for performance
#    - Consider compaction for long-running tables
